[package]
name = "trimsheet_maker"
version = "0.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bevy = { version = "0.19.1", features = ["exr"] }
bevy_egui = "0.42.0"
exr = "1.74.0"
rayon = "1.12.0"
rfd = "0.17.2"
serde = "1.0.229"
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
ron = "0.12.2"
libloading = "0.9.0"
gltf = { version = "1.4.1", features = ["utils"] }
half = "2.7.1"
mikktspace = "0.3.0"
futures-lite = "2.6.1"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "tga",
    "bmp",
    "tiff",
] }
meshopt = "0.7"